name: e2e
# Browser suites on a production build, against a fake Supabase and a mocked API.
on:
  push:
    branches: [new_feat, main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
jobs:
  browsers:
    # The suites that guard the newest screens and the cross-browser, slow-network and accessibility checks.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://sentria-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      E2E_URL: http://localhost:3201
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the app
        run: |
          nohup pnpm exec next start -p 3201 > /tmp/next.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3201 --timeout 60000
      - name: Install the browsers (Chromium, Firefox, WebKit)
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium firefox webkit
      - name: Run the suites
        working-directory: tests/e2e
        run: node run-all.js a11y slownet crossbrowser statuspages briefing weekrep adminchecks errortracking
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/shots
          if-no-files-found: ignore
  full:
    # Every suite, once a week. It reports; it does not block a push.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://sentria-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      E2E_URL: http://localhost:3201
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          nohup pnpm exec next start -p 3201 > /tmp/next.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3201 --timeout 60000
      - working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: tests/e2e
        run: node run-all.js
